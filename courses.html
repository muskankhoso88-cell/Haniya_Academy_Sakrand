{% extends "base.html" %}
{% block content %}
<div class="dash-page">
  <h2>Manage Courses</h2>
  <a class="back-link" href="{{ url_for('admin.dashboard') }}">&larr; Back to Dashboard</a>

  <form class="dash-form" method="POST" action="{{ url_for('admin.courses_add') }}">
    <input type="text" name="title" placeholder="Course Title" required>
    <input type="text" name="duration" placeholder="Duration (e.g. 1 Year)">
    <input type="number" step="0.01" name="fee" placeholder="Fee">
    <input type="number" name="display_order" placeholder="Display Order">
    <textarea name="description" placeholder="Description"></textarea>
    <button type="submit">Add Course</button>
  </form>

  <div class="table-wrap">
    <table class="dash-table">
      <tr><th>Title</th><th>Duration</th><th>Fee</th><th></th></tr>
      {% for c in courses %}
      <tr>
        <td>{{ c.title }}</td>
        <td>{{ c.duration }}</td>
        <td>{{ c.fee }}</td>
        <td>
          <form method="POST" action="{{ url_for('admin.courses_delete', course_id=c.course_id) }}" style="display:inline;">
            <button type="submit" class="btn-sm btn-sm-danger">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>
{% endblock %}
