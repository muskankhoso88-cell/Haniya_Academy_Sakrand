{% extends "base.html" %}
{% block content %}
<div class="dash-page">
  <h2>Manage Results</h2>
  <a class="back-link" href="{{ url_for('admin.dashboard') }}">&larr; Back to Dashboard</a>

  <form class="dash-form" method="POST" action="{{ url_for('admin.results_add') }}">
    <select name="student_id" required>
      <option value="">Select Student</option>
      {% for s in students %}
        <option value="{{ s.student_id }}">{{ s.roll_number }} — {{ s.full_name }}</option>
      {% endfor %}
    </select>
    <select name="course_id">
      <option value="">Course (optional)</option>
      {% for c in courses %}
        <option value="{{ c.course_id }}">{{ c.title }}</option>
      {% endfor %}
    </select>
    <input type="text" name="test_name" placeholder="Test Name" required>
    <input type="number" step="0.01" name="marks_obtained" placeholder="Marks Obtained">
    <input type="number" step="0.01" name="total_marks" placeholder="Total Marks">
    <input type="date" name="result_date">
    <button type="submit">Add Result</button>
  </form>

  <div class="table-wrap">
    <table class="dash-table">
      <tr><th>Student</th><th>Test</th><th>Marks</th><th>Date</th><th></th></tr>
      {% for r in results %}
      <tr>
        <td>{{ r.student.roll_number }} — {{ r.student.full_name }}</td>
        <td>{{ r.test_name }}</td>
        <td>{{ r.marks_obtained }}/{{ r.total_marks }}</td>
        <td>{{ r.result_date }}</td>
        <td>
          <form method="POST" action="{{ url_for('admin.results_delete', result_id=r.result_id) }}" style="display:inline;">
            <button type="submit" class="btn-sm btn-sm-danger">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>
{% endblock %}
