version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-haniya123}
      MYSQL_DATABASE: haniya_academy
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-haniya123}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: haniya_academy
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      PORT: 5000
    ports:
      - "5000:5000"
    command: >
      sh -c "python seed_data.py && gunicorn -w 4 -b 0.0.0.0:5000 run:app"

volumes:
  db_data:
