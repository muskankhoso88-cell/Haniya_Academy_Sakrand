{% extends "base.html" %}
{% block content %}
<div class="dash-page">
  <h2>Contact Messages</h2>
  <a class="back-link" href="{{ url_for('admin.dashboard') }}">&larr; Back to Dashboard</a>
  <div class="table-wrap">
    <table class="dash-table">
      <tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th><th>Date</th></tr>
      {% for m in messages %}
      <tr>
        <td>{{ m.name }}</td>
        <td>{{ m.email }}</td>
        <td>{{ m.phone }}</td>
        <td>{{ m.message }}</td>
        <td>{{ m.submitted_at }}</td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>
{% endblock %}
