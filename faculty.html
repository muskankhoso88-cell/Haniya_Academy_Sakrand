{% extends "base.html" %}
{% block content %}
<div class="dash-page">
  <h2>Manage Faculty</h2>
  <a class="back-link" href="{{ url_for('admin.dashboard') }}">&larr; Back to Dashboard</a>

  <form class="dash-form" method="POST" action="{{ url_for('admin.faculty_add') }}">
    <input type="text" name="full_name" placeholder="Full Name" required>
    <input type="text" name="designation" placeholder="Designation">
    <input type="text" name="subject" placeholder="Subject">
    <input type="text" name="photo_url" placeholder="Photo URL">
    <input type="number" name="display_order" placeholder="Display Order">
    <textarea name="bio" placeholder="Short Bio"></textarea>
    <button type="submit">Add Faculty</button>
  </form>

  <div class="table-wrap">
    <table class="dash-table">
      <tr><th>Photo</th><th>Name</th><th>Designation</th><th>Subject</th><th></th></tr>
      {% for f in faculty %}
      <tr>
        <td><img src="{{ f.photo_url or url_for('static', filename='images/placeholder.jpg') }}" alt=""></td>
        <td>{{ f.full_name }}</td>
        <td>{{ f.designation }}</td>
        <td>{{ f.subject }}</td>
        <td>
          <form method="POST" action="{{ url_for('admin.faculty_delete', faculty_id=f.faculty_id) }}" style="display:inline;">
            <button type="submit" class="btn-sm btn-sm-danger">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>
{% endblock %}
